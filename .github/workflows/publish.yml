name: Publish
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npx @vscode/vsce package -o ugly-like-me.vsix
      - run: npx @vscode/vsce publish --packagePath ugly-like-me.vsix -p ${{ secrets.VSCE_PAT }}
      - run: npx ovsx publish ugly-like-me.vsix -p ${{ secrets.OVSX_PAT }}
